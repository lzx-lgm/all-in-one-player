name: Build & Release (Windows / macOS / Linux)

# 打版本标签即触发三系统打包，并把安装包发布到 GitHub Releases
# 例：git tag v2.0.0 && git push origin v2.0.0
# 也可以在 Actions 里手动触发（workflow_dispatch）先打一套安装包验证，
# 验证通过后再打标签正式发布。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 发布安装包到 Releases 需要写权限（缺省的只读 token 会在更新 release 时报
# "Resource not accessible by integration"）
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  # 三个系统都打完后，由单独一个任务统一发布，避免三个任务同时
  # 往同一个 release 写文件互相冲突。
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
